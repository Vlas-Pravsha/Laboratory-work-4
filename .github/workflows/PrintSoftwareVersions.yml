name: Print Software Versions

on:
  push:
    branches: [main]

jobs:
  PrintBLVersions:
    runs-on: ubuntu-latest
    steps:
      - name: Print Node.js Version
        run: node --version

      - name: Print npm Version
        run: npm --version

      - name: Install Express and print version
        run: |
          npm install express
          node -e "const e = require('express'); console.log('Express version:', e.version);"

  PrintALVersions:
    runs-on: ubuntu-latest
    needs: [PrintBLVersions]
    steps:
      - name: Print PostgreSQL Version
        run: psql --version

      - name: Print pg_config Version
        run: pg_config --version
